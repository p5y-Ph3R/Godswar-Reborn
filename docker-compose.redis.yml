# Opt-in Redis coordination for the main `reborn` Compose project.
#
# Start the coordinated server and its B20H observer only through the reviewed
# activation procedure. Once that observation starts, do not recreate either
# container or fall back to the base Local-coordination profile.
services:
  redis-coordination:
    profiles: ["redis-coordinated"]
    image: "${GODSWAR_REDIS_IMAGE:-redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2}"
    container_name: godswar-main-redis-coordination
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    user: redis
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /data:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - ./ops/redis/redis-coordination.local.conf:/usr/local/etc/redis/redis.conf:ro
    secrets:
      - source: redis-main-acl
        target: redis_acl
      - source: redis-main-password
        target: redis_password
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli --user godswar_runtime ping | grep -qx PONG
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      com.reborn.data.role: disposable-coordination
      com.reborn.environment.scope: main-local-development

  server:
    profiles: ["redis-coordinated"]
    depends_on:
      redis-coordination:
        condition: service_healthy
    entrypoint:
      - dotnet
      - Godswar.Server.dll
      - /app/config/redis-coordinated-worker.json
    command: []
    volumes:
      - ./deploy/local/redis-coordinated-worker.json:/app/config/redis-coordinated-worker.json:ro
    secrets:
      - source: redis-main-connection-string
        target: redis_connection_string
    environment:
      GODSWAR_COORDINATION_PROVIDER: Redis
      GODSWAR_COORDINATION_ENVIRONMENT: tempest-local
      GODSWAR_REDIS_CONNECTION_STRING_FILE: /run/secrets/redis_connection_string
      GODSWAR_REDIS_REQUIRE_TLS: "false"
      GODSWAR_REDIS_DATABASE: "0"
      GODSWAR_COORDINATION_CAPACITY: "4096"
      GODSWAR_REDIS_MAXIMUM_CONCURRENT_OPERATIONS: "128"
      GODSWAR_REDIS_QUEUE_ADMISSION_TIMEOUT_MILLISECONDS: "25"
      GODSWAR_REDIS_OPERATION_TIMEOUT_MILLISECONDS: "250"
      GODSWAR_REDIS_CONNECT_TIMEOUT_MILLISECONDS: "1000"
      GODSWAR_REDIS_CIRCUIT_FAILURE_THRESHOLD: "5"
      GODSWAR_REDIS_CIRCUIT_OPEN_MILLISECONDS: "5000"
      GODSWAR_COORDINATION_SERVER_HEARTBEAT_SECONDS: "5"
      GODSWAR_COORDINATION_SERVER_TTL_SECONDS: "20"
      GODSWAR_COORDINATION_PLAYER_LEASE_RENEWAL_SECONDS: "10"
      GODSWAR_COORDINATION_PLAYER_LEASE_TTL_SECONDS: "30"
      GODSWAR_WORLD_INSTANCE_SERVER_NODE_ID: tempest-openworld-01
    labels:
      com.reborn.coordination.provider: redis
      com.reborn.world.owner: tempest-openworld-01

secrets:
  redis-main-acl:
    file: "${GODSWAR_REDIS_ACL_FILE:?Run tools/NewRedisMainLocalConfiguration.ps1 first}"
  redis-main-password:
    file: "${GODSWAR_REDIS_PASSWORD_FILE:?Run tools/NewRedisMainLocalConfiguration.ps1 first}"
  redis-main-connection-string:
    file: "${GODSWAR_REDIS_CONNECTION_STRING_FILE_HOST:?Run tools/NewRedisMainLocalConfiguration.ps1 first}"
