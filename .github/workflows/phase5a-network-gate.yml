name: Phase 5A network gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  bounded-network-gate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore GodswarServer.sln

      - name: Release build
        shell: pwsh
        run: dotnet build GodswarServer.sln --configuration Release --no-restore --nologo

      - name: Data-boundary architecture ratchet
        shell: pwsh
        run: |
          dotnet tests/Godswar.Server.ProtocolChecks/bin/Release/net10.0/Godswar.Server.ProtocolChecks.dll `
            "Data-boundary architecture ratchet"

      - name: Replay, fuzz, metrics, overload, and admission checks
        shell: pwsh
        run: |
          dotnet tests/Godswar.Server.ProtocolChecks/bin/Release/net10.0/Godswar.Server.ProtocolChecks.dll `
            "Secure Phase 5A" `
            "deterministic network emulation and overload" `
            "UDP bounded loopback baseline"

      - name: Bounded load self-check
        shell: pwsh
        run: |
          dotnet tools/Godswar.Server.Phase5A/bin/Release/net10.0/Godswar.Server.Phase5A.dll `
            --self-check

      - name: Two-second targetless paced probe
        shell: pwsh
        run: |
          dotnet tools/Godswar.Server.Phase5A/bin/Release/net10.0/Godswar.Server.Phase5A.dll `
            --mode paced-soak `
            --bots 16 `
            --duration-seconds 2 `
            --seed 20260728

  postgresql-17-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: reborn_ci
          POSTGRES_PASSWORD: reborn_b03_ci_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U reborn_ci -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore GodswarServer.sln

      - name: Release build
        shell: pwsh
        run: dotnet build GodswarServer.sln --configuration Release --no-restore --nologo

      - name: Mandatory PostgreSQL 17 migration and integration gate
        shell: pwsh
        env:
          GODSWAR_B03_POSTGRES_PASSWORD: reborn_b03_ci_only
        run: |
          ./tools/InvokeB03PostgresCiGate.ps1 `
            -ContainerId '${{ job.services.postgres.id }}' `
            -PostgresHost '127.0.0.1' `
            -PostgresPort ${{ job.services.postgres.ports['5432'] }} `
            -PostgresUser 'reborn_ci' `
            -ReportPath 'artifacts/b03/postgres-ci-result.json'

      - name: PostgreSQL gate summary
        if: always()
        shell: pwsh
        run: |
          $report = 'artifacts/b03/postgres-ci-result.json'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
            New-Item `
              -ItemType Directory `
              -Path (Split-Path -Parent $report) `
              -Force | Out-Null
            [ordered]@{
              schemaVersion = 1
              gate = 'B03 mandatory disposable PostgreSQL'
              status = 'failed'
              startedAtUtc = $null
              finishedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
              durationMs = 0
              sourceCommit = $env:GITHUB_SHA
              checks = @()
              scenarios = @()
              cleanup = @{
                status = 'not-started'
                errors = @()
              }
              failureCategory = 'workflow-before-gate'
              failureMessage = 'The workflow failed before the B03 runner produced a result.'
            } | ConvertTo-Json -Depth 6 |
              Set-Content -LiteralPath $report -Encoding utf8
          }
          $result = Get-Content -LiteralPath $report -Raw |
            ConvertFrom-Json
          @(
            '## PostgreSQL 17 gate'
            ''
            "- Status: ``$($result.status)``"
            "- Duration: ``$($result.durationMs) ms``"
            if ($result.failureCategory) {
              "- Failure category: ``$($result.failureCategory)``"
            }
            "- Machine result: ``$report``"
          ) | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Upload PostgreSQL gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b03-postgres-ci-result
          path: artifacts/b03/postgres-ci-result.json
          if-no-files-found: error
          retention-days: 14

  redis-7-4-coordination-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore GodswarServer.sln

      - name: Mandatory isolated Redis 7.4 coordination gate
        shell: pwsh
        run: |
          ./tools/InvokeB17RedisCiGate.ps1 `
            -RedisImage 'redis:7.4.10-alpine' `
            -ReportPath 'artifacts/b17/redis-ci-result.json'

      - name: Redis coordination gate summary
        if: always()
        shell: pwsh
        run: |
          $report = 'artifacts/b17/redis-ci-result.json'
          if (Test-Path -LiteralPath $report -PathType Leaf) {
            $result = Get-Content -LiteralPath $report -Raw |
              ConvertFrom-Json
            @(
              '## Redis 7.4 coordination gate'
              ''
              "- Status: ``$($result.status)``"
              "- Duration: ``$($result.durationMs) ms``"
              "- Machine result: ``$report``"
            ) | Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
          }

      - name: Upload Redis coordination gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b17-redis-ci-result
          path: artifacts/b17/redis-ci-result.json
          if-no-files-found: error
          retention-days: 14

  b19-postgresql-recovery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore GodswarServer.sln

      - name: Release build
        shell: pwsh
        run: dotnet build GodswarServer.sln --configuration Release --no-restore --nologo

      - name: B20H retirement-evidence validator self-test
        shell: pwsh
        run: ./tools/TestB20RetirementEvidence.ps1 -SelfTest

      - name: B20H Docker observation configuration gate
        shell: pwsh
        run: ./tools/TestB20HDockerObservation.ps1

      - name: Mandatory isolated B19 reconciliation recovery gate
        shell: pwsh
        run: |
          ./tools/InvokeB19PostgresRecoveryGate.ps1 `
            -PostgresImage 'postgres:17.9-alpine' `
            -ReportPath 'artifacts/b19/recovery-gate-result.json'

      - name: B19 recovery gate summary
        if: always()
        shell: pwsh
        run: |
          $report = 'artifacts/b19/recovery-gate-result.json'
          if (Test-Path -LiteralPath $report -PathType Leaf) {
            $result = Get-Content -LiteralPath $report -Raw |
              ConvertFrom-Json
            @(
              '## B19 PostgreSQL reconciliation recovery gate'
              ''
              "- Status: ``$($result.status)``"
              "- Source tree dirty: ``$($result.sourceTreeDirty)``"
              "- Duration: ``$($result.durationMs) ms``"
              "- Dump: ``$($result.recovery.dumpBytes) bytes``"
              "- Restore: ``$($result.recovery.restoreDurationMs) ms``"
              "- Verified ready: ``$($result.recovery.verifiedReadyDurationMs) ms``"
              "- Production RPO claim: ``$($result.recovery.productionRpoClaim)``"
              "- Production RTO claim: ``$($result.recovery.productionRtoClaim)``"
              "- Machine result: ``$report``"
            ) | Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
          }

      - name: Upload B19 recovery gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b19-postgresql-recovery-result
          path: artifacts/b19/recovery-gate-result.json
          if-no-files-found: error
          retention-days: 14
