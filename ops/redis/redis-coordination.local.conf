# B17 disposable local/CI coordination only.
# Production must use a private TLS endpoint, managed credentials, explicit
# capacity, and a reviewed provider topology.

bind 0.0.0.0
protected-mode yes
port 6379
tls-port 0
aclfile /run/secrets/redis_acl

daemonize no
supervised no
loglevel notice
logfile ""

databases 1
save ""
appendonly no
dir /tmp

maxmemory 256mb
maxmemory-policy noeviction
maxclients 256
timeout 0
tcp-keepalive 60

enable-protected-configs no
enable-debug-command no
enable-module-command no
